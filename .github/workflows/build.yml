name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

concurrency:
  group: voicetuner-build
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Preflight check（静态体检：启动顺序 / 资源 id）
        run: python3 tools/preflight_check.py

      - name: Build release APK
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: |
          cd app/build/outputs/apk/release
          f=$(ls -1 *.apk 2>/dev/null | head -1)
          if [ -z "$f" ]; then echo "未找到 APK"; exit 1; fi
          mv "$f" PrimaTune.apk
          ls -l PrimaTune.apk

      - name: Upload APK (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: PrimaTune-apk
          path: app/build/outputs/apk/release/PrimaTune.apk

      # ===== 手机书签一个直链，永远下最新版 =====
      # https://github.com/Sideroca/PrimaTune/releases/latest/download/PrimaTune.apk
      - name: 更新「latest」直链发布
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          APK=app/build/outputs/apk/release/PrimaTune.apk
          # 有旧发布就覆盖上传（避免"删了建不回来"的空窗）
          V=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          TITLE="玲珑调音 · Prima Tune · v$V · 最新构建"
          NOTES=$(printf '**版本：v%s** ｜ 每次推送自动更新。\n\n点下方 **Assets → PrimaTune.apk** 直接下载安装（签名固定，覆盖安装即可）。\n\n固定直链（收藏它，永远最新）：\n`https://github.com/Sideroca/PrimaTune/releases/latest/download/PrimaTune.apk`' "$V")
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest "$APK" --clobber
            gh release edit latest --latest --title "$TITLE" --notes "$NOTES"
          else
            gh release create latest "$APK" --title "$TITLE" --notes "$NOTES" --latest
          fi
          # 把 latest 标签指向本次提交（失败不致命）
          git tag -f latest "$GITHUB_SHA"
          git push -f origin latest || true
